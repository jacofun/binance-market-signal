name: Test and deploy market signal FC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-signal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Type check and test application
        run: npm run check && npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-deploy.txt
      - name: Install deployment SDK
        run: python -m pip install -r scripts/requirements-deploy.txt
      - name: Test deployment safety and package
        run: |
          python -m unittest discover -s test -p 'test_deploy_fc.py' -v
          python scripts/package.py
      - name: Validate existing FC runtime and resources
        if: github.event_name != 'pull_request'
        env:
          ALIYUN_FC_ACCESS_KEY_ID: ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }}
          ALIYUN_FC_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }}
        run: python scripts/deploy_fc.py --preflight
      - name: Check main still points to this commit
        if: github.event_name != 'pull_request'
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping outdated deployment.'
          fi
      - name: Deploy and verify code, runtime and health
        if: github.event_name != 'pull_request' && steps.current.outputs.deploy == 'true'
        env:
          ALIYUN_FC_ACCESS_KEY_ID: ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }}
          ALIYUN_FC_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }}
        run: python scripts/deploy_fc.py
