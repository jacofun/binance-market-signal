# CI preserves environment variables, role, layers and resources.
# After code verification it reconciles existing analysis and entry recheck timers.
edition: 3.0.0
name: binance-market-signal
access: default
resources:
  marketSignal:
    component: fc3
    props:
      region: ap-southeast-1
      functionName: binance-market-signal
      runtime: custom.debian12
      cpu: 0.35
      memorySize: 512
      diskSize: 10240
      timeout: 120
      customRuntimeConfig:
        command: ["/bin/sh", "/code/bootstrap"]
        args: []
        port: 9000
      code: ./dist/binance-market-signal.zip
      analysisCron: "5 */5 * * * *"
      entryRecheckCron: "15 * * * * *"
