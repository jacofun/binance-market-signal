# CI preserves environment variables, role, layers and resources. Only the
# scanner timer cadence is managed separately after code verification.
edition: 3.0.0
name: binance-market-signal
access: default
resources:
  marketSignal:
    component: fc3
    props:
      region: ap-southeast-1
      functionName: binance-market-signal
      runtime: custom.debian12
      cpu: 0.35
      memorySize: 512
      diskSize: 10240
      timeout: 120
      customRuntimeConfig:
        command: ["/bin/sh", "/code/bootstrap"]
        args: []
        port: 9000
      code: ./dist/binance-market-signal.zip
      scannerCron: "5 * * * * *"
